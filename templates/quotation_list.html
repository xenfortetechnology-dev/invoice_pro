{% extends "base.html" %}
{% block content %}
<div class="container py-4">
   <!-- Toast Container -->
   <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

   <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Quotations</h3>
      <a href="{{ url_for('quotation_form') }}" class="btn btn-primary">
         + Create New Quotation
      </a>
   </div>

   <div class="glass-card p-0 overflow-hidden shadow-sm border-0">
      <table class="table table-hover mb-0">
         <thead class="bg-light">
            <tr>
               <th class="ps-3">No</th>
               <th>Quotation</th>
               <th>Status</th>
               <th>Total</th>
               <th class="text-end pe-3">Actions</th>
            </tr>
         </thead>
         <tbody>
            {% for q in quotations.items %}
            <tr>
               <td class="ps-3">{{ loop.index }}</td>
               <td class="fw-bold">{{ q.quotation_number }}</td>
               <td>
                  <span
                     class="badge bg-{{ 'success' if q.status == 'Accepted' else 'warning' if q.status == 'Sent' else 'secondary' }}">
                     {{ q.status }}
                  </span>
               </td>
               <td class="text-primary fw-bold">₹{{ q.grand_total }}</td>
               <td class="text-end pe-3">
                  <div class="d-flex justify-content-end gap-1">
                     <a href="{{ url_for('quotation_preview', qid=q.id) }}" class="btn btn-sm btn-info text-white"
                        title="Preview">
                        <i data-feather="eye" size="14"></i>
                     </a>
                     <a href="javascript:void(0)" onclick="downloadQuotationPDF('{{ q.id }}')"
                        class="btn btn-sm btn-primary" title="PDF">
                        <i data-feather="file-text" size="14"></i>
                     </a>
                     <a href="{{ url_for('edit_quotation', qid=q.id) }}" class="btn btn-sm btn-warning" title="Edit">
                        <i data-feather="edit" size="14"></i>
                     </a>
                     <a href="{{ url_for('convert_to_invoice', qid=q.id) }}" class="btn btn-sm btn-success"
                        title="Convert">
                        <i data-feather="refresh-cw" size="14"></i>
                     </a>
                     <a href="{{ url_for('send_email', qid=q.id) }}" class="btn btn-sm btn-warning" title="Email">
                        <i data-feather="mail" size="14"></i>
                     </a>
                     <a href="{{ url_for('send_whatsapp', qid=q.id) }}" class="btn btn-sm btn-success" title="WhatsApp">
                        <i data-feather="message-circle" size="14"></i>
                     </a>
                     <a href="{{ url_for('delete_quotation', qid=q.id) }}" class="btn btn-sm btn-danger"
                        onclick="return confirm('Are you sure you want to delete this quotation?')" title="Delete">
                        <i data-feather="trash-2" size="14"></i>
                     </a>
                  </div>
               </td>
            </tr>
            {% endfor %}
         </tbody>
      </table>
   </div>
</div>

<script>
   function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `glass-card p-3 mb-2 animate-slide-up bg-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'primary'} text-white`;
      toast.style.minWidth = '250px';
      toast.style.boxShadow = '0 8px 32px rgba(0,0,0,0.2)';
      toast.innerHTML = `
        <div class="d-flex align-items-center">
            <i data-feather="${type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info'}" class="me-2"></i>
            <div>${message}</div>
        </div>
    `;
      container.appendChild(toast);
      feather.replace();

      setTimeout(() => {
         toast.style.opacity = '0';
         toast.style.transform = 'translateX(20px)';
         toast.style.transition = 'all 0.5s ease-out';
         setTimeout(() => toast.remove(), 500);
      }, 5000);
   }

   function downloadQuotationPDF(qid) {
      showToast('Generating Quotation PDF...', 'primary');

      fetch(`/quotations/${qid}/pdf?t=${new Date().getTime()}`)
         .then(response => {
            if (response.ok) {
               return response.blob().then(blob => {
                  const url = window.URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.style.display = 'none';
                  a.href = url;
                  // extracting filename from content-disposition header if available, or default
                  const disposition = response.headers.get('Content-Disposition');
                  let filename = `Quotation_${qid}.pdf`;
                  if (disposition && disposition.indexOf('attachment') !== -1) {
                     const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                     const matches = filenameRegex.exec(disposition);
                     if (matches != null && matches[1]) {
                        filename = matches[1].replace(/['"]/g, '');
                     }
                  }
                  a.download = filename;
                  document.body.appendChild(a);
                  a.click();
                  window.URL.revokeObjectURL(url);
                  showToast('PDF Downloaded Successfully!', 'success');
               });
            } else {
               showToast('Failed to download PDF.', 'error');
            }
         })
         .catch(error => {
            console.error('Download error:', error);
            showToast('An error occurred during download.', 'error');
         });
   }

   document.addEventListener('DOMContentLoaded', () => {
      feather.replace();
   });
</script>
{% endblock %}
